<select id="market">
    <option value="kalyan">Kalyan</option>
    <option value="main-bazar">Main Bazar</option>
</select>

<button onclick="syncMarket()">⚡ FETCH MARKET HISTORY</button>

<script>
async function syncMarket() {
    const market = document.getElementById("market").value;

    const log = document.getElementById("log");
    log.textContent = "FETCHING " + market.toUpperCase() + "…";

    try {
        const response = await fetch(
            "/api/sync?market=" + encodeURIComponent(market)
        );

        const data = await response.json();

        if (!data.ok) {
            throw new Error(data.error || "Sync failed");
        }

        document.getElementById("records").textContent =
            data.analysis.records;

        document.getElementById("unique").textContent =
            data.analysis.unique_panels;

        log.textContent =
            "SYNC COMPLETE\n" +
            "SOURCE: " + data.source + "\n" +
            "ROWS FOUND: " + data.rows_found + "\n" +
            "NEW RECORDS: " + data.new_records;

        console.log(data);

    } catch (error) {
        log.textContent =
            "FETCH ERROR: " + error.message;
    }
}
</script>
